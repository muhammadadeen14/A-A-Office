name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: microsoft/setup-msbuild@v2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run dist:win:release 2>&1 | Tee-Object -FilePath packaging.log
          $packageExit = $LASTEXITCODE
          if ($packageExit -ne 0) {
            Get-Content packaging.log -Tail 20 | ForEach-Object {
              $safeLine = $_ -replace '%', '%25' -replace ':', '%3A' -replace ',', '%2C'
              Write-Output "::error title=Packaging diagnostic::$safeLine"
            }
            exit $packageExit
          }
        env:
          npm_config_msvs_version: '2022'
      - uses: actions/upload-artifact@v4
        with:
          name: A&A-Office-Windows-x64
          path: release/A&A-Office-Setup.exe
          if-no-files-found: error
      - name: Upload packaging diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A&A-Office-Windows-diagnostic
          path: packaging.log
          if-no-files-found: warn
