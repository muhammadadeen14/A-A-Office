name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      npm_config_msvs_version: '2022'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win:release
      - uses: actions/upload-artifact@v4
        with:
          name: A&A-Office-Windows-x64
          path: release/A&A-Office-Setup.exe
          if-no-files-found: error
